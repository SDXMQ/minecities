plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddevgradle_plugin_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    }
    withSourcesJar()
}

repositories {
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include 'com/citiescolony/**'
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
            include 'META-INF/neoforge.mods.toml'
            include 'META-INF/accesstransformer.cfg'
            include 'assets/citiescolony/**'
            include 'data/citiescolony/**'
            include 'pack.mcmeta'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
            include 'com/citiescolony/**'
        }
    }
}

neoForge {
    version = project.neoforge_version

    accessTransformers {
        from file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments.addAll('-XX:+UseCompactObjectHeaders')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArguments.addAll('-XX:+UseCompactObjectHeaders')
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.5'
    distributionType = Wrapper.DistributionType.BIN
}